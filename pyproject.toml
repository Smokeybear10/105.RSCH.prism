[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-equity-research"
version = "0.1.0"
description = "Reproducible forecasts of peer-stock responses to corporate announcements"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2",
  "numpy>=1.24", "pandas>=2", "pyarrow>=12", "requests>=2.31",
  "beautifulsoup4>=4.12",
  "exchange-calendars>=4.13,<5",
]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
relay = "relay.cli:main"

[tool.setuptools.packages.find]
include = ["relay*"]
exclude = ["relay.tests*"]

[tool.setuptools.package-data]
relay = ["static/*", "data/*.json"]
